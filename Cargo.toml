[workspace]
resolver = "2"
members = [
    "crates/clipak-core",
    "crates/clipak-runtime",
    "crates/clipak-builder",
    "crates/clipak-daemon",
    "crates/clipak-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Logan <logan@fedoraproject.org>", "Clipak Contributors"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/clipak/clipak"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
tempfile = "3.12"
walkdir = "2.5"
nix = { version = "0.29", features = ["mount", "sched", "user", "process", "fs"] }
openssl = "0.10"
