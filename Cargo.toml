[workspace]
resolver = "2"
members = [
    "crates/clipak-core",
    "crates/clipak-runtime",
    "crates/clipak-builder",
    "crates/clipak-daemon",
    "crates/clipak-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Logan <bairdlevenicklogan@gmail.com>", "Clipak Contributors"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/LoganBaird-Levenick/clipak"
homepage = "https://github.com/LoganBaird-Levenick/clipak"
documentation = "https://github.com/LoganBaird-Levenick/clipak#readme"
readme = "README.md"
description = "Unconfined developer tool delivery system for atomic Linux operating systems"
keywords = ["atomic-os", "developer-tools", "ddi", "dm-verity", "bubblewrap"]
categories = ["command-line-utilities", "development-tools", "os::linux-apis"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
tempfile = "3.12"
walkdir = "2.5"
nix = { version = "0.29", features = ["mount", "sched", "user", "process", "fs"] }
openssl = { version = "0.10", features = ["vendored"] }
comfy-table = "8.0"
colored = "3.1"
indicatif = "0.18"
